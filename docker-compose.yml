services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: okan-kaptan-site
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - okan_kaptan_data:/app/data
      - okan_kaptan_uploads:/app/public/uploads

volumes:
  okan_kaptan_data:
  okan_kaptan_uploads:
